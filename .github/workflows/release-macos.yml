name: Build macOS releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            asset: bozo-macos-intel.tar.gz
          - rid: osx-arm64
            asset: bozo-macos-apple-silicon.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single-file app
        run: |
          dotnet publish bozo.csproj -c Release -r "${{ matrix.rid }}" --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish
          chmod +x publish/bozo
          tar -czf "${{ matrix.asset }}" -C publish bozo

      - name: Attach build to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
